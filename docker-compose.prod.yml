# Production overlay:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences from a local run: only Caddy is reachable from outside, and it
# also handles HTTPS; the web port isn't published externally.

services:
  web:
    # The port stays reachable inside the compose network but not on the host:
    # only Caddy reaches it from outside.
    ports: !override []
    environment:
      POSTGRES_HOST: db
      SESSION_SECURE_COOKIE: "true"

  db:
    # The database is never exposed to the outside, under any circumstances.
    ports: !override []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env}
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
