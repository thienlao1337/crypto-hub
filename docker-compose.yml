services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cryptohub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cryptohub}
      POSTGRES_DB: ${POSTGRES_DB:-cryptohub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cryptohub} -d ${POSTGRES_DB:-cryptohub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    env_file:
      - .env

  migrate:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    command: uvicorn app.web.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    ports:
      # Inside the container the port is always 8000; WEB_PUBLIC_PORT is
      # published outside - so it doesn't clash with anything else on the host.
      - "${WEB_PUBLIC_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.worker.main
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  bot:
    build: .
    restart: unless-stopped
    command: python -m app.bot.main
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Run the tests in the same environment as the runtime:
  #   docker compose --profile test run --rm tests
  tests:
    build:
      context: .
      target: dev
    profiles: ["test"]
    command: pytest -q
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    # Tests run on PostgreSQL (in a separate database with the _test suffix),
    # not on SQLite: there Numeric is stored as float and money loses
    # precision.
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
