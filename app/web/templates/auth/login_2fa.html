{% extends "auth/base.html" %}
{% block title %}Подтверждение входа — Crypto Hub{% endblock %}

{% block auth_content %}
<h1>Подтверждение</h1>
<p class="muted">Введите код из приложения-аутентификатора.</p>

<form method="post" action="/login/2fa">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <div class="field">
    <label for="code">Код</label>
    <input type="text" id="code" name="code" class="code-input"
           inputmode="numeric" autocomplete="one-time-code"
           maxlength="14" required autofocus>
  </div>

  <button type="submit" class="btn btn-primary btn-block">Подтвердить</button>
</form>

<div class="form-footer">
  Нет доступа к приложению? Введите в это же поле один из кодов
  восстановления — он сработает один раз.
  <form method="post" action="/logout" style="margin-top: 12px">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="btn btn-ghost btn-block">Войти под другим аккаунтом</button>
  </form>
</div>
{% endblock %}
