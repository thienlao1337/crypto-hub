{% extends "auth/base.html" %}
{% block title %}Вход — Crypto Hub{% endblock %}

{% block auth_content %}
<h1>Вход</h1>
<p class="muted">Панель крипто-инвестора: портфель, рынок, сигналы.</p>

<form method="post" action="/login" autocomplete="on">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

  <div class="field">
    <label for="email">Почта</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}"
           autocomplete="username" required autofocus>
  </div>

  <div class="field">
    <label for="password">Пароль</label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" required>
  </div>

  <button type="submit" class="btn btn-primary btn-block">Войти</button>
</form>

<div class="form-footer">
  Регистрация закрытая — нужен код приглашения от владельца.
</div>
{% endblock %}
